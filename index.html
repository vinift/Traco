<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="mobile-web-app-capable" content="yes">
<title>Traço Notas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=0.2.1">
</head>
<body>
<!--APP-START-->
<div id="app">
  <!-- ===== Biblioteca ===== -->
  <section id="library" class="screen">
    <header class="lib-head">
      <div class="brand"><span class="logo"></span>Traço</div>
      <div class="search"><span data-icon="search"></span><input id="libSearch" type="search" placeholder="Buscar notas"></div>
      <div class="lib-actions">
        <span id="libSync" class="sync-pill" title="Backup no Google Drive"></span>
        <button class="btn ghost" id="btnNewFolder"><span data-icon="folder"></span><span class="lbl">Nova pasta</span></button>
        <button class="btn ghost" id="btnImportPdf"><span data-icon="file"></span><span class="lbl">Importar PDF</span></button>
        <button class="btn primary" id="btnNewNote"><span data-icon="plus"></span><span class="lbl">Nova nota</span></button>
        <button class="icon-btn" id="btnSettings" title="Configurações"><span data-icon="settings"></span></button>
      </div>
    </header>
    <nav id="crumbs" class="crumbs"></nav>
    <main class="lib-body">
      <div id="folderGrid" class="folder-grid"></div>
      <div id="noteGrid" class="note-grid"></div>
      <div id="libEmpty" class="empty hidden">
        <p>Nenhuma nota aqui ainda.</p>
        <button class="btn primary" id="btnNewNote2"><span data-icon="plus"></span>Criar a primeira nota</button>
      </div>
    </main>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" class="screen hidden">
    <div id="stage">
      <canvas id="cMain"></canvas>
      <canvas id="cLive"></canvas>
      <div id="overlay"></div>
      <div id="selBar" class="sel-bar hidden"></div>
    </div>
    <!-- Cromo flutuante (estilo Notewise) -->
    <div class="chrome ch-topleft">
      <button class="cbtn round" id="btnBack" title="Voltar"><span data-icon="arrowLeft"></span></button>
      <div class="cpill">
        <button class="cbtn" id="btnPages" title="Páginas e modelo"><span data-icon="pages"></span></button>
        <button class="cbtn" id="btnAddPage" title="Adicionar página"><span data-icon="addPage"></span></button>
        <button class="cbtn" id="btnExport" title="Exportar"><span data-icon="download"></span></button>
        <input id="noteTitle" class="title-input" spellcheck="false" title="Título da nota">
      </div>
    </div>
    <div class="chrome ch-topright">
      <div class="cpill">
        <span id="edSync" class="sync-pill small"></span>
        <button class="cbtn" id="hudPage" title="Páginas">1 / 1</button>
        <button class="cbtn" id="hudZoom" title="Zoom">100%</button>
        <button class="cbtn" id="btnEdSettings" title="Configurações"><span data-icon="more"></span></button>
      </div>
    </div>
    <nav class="chrome rail" id="rail"></nav>
    <nav class="chrome subrail" id="subrail"></nav>
    <div class="chrome tool-panel hidden" id="toolPanel"></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="popRoot"></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="filePick" class="hidden">
<script src="js/util.js?v=0.2.1"></script>
<script src="js/store.js?v=0.2.1"></script>
<script src="js/geom.js?v=0.2.1"></script>
<script src="js/render.js?v=0.2.1"></script>
<script src="js/pdf.js?v=0.2.1"></script>
<script src="js/drive.js?v=0.2.1"></script>
<script src="js/editor.js?v=0.2.1"></script>
<script src="js/toolbar.js?v=0.2.1"></script>
<script src="js/ui.js?v=0.2.1"></script>
<script src="js/library.js?v=0.2.1"></script>
<script src="js/plugins.js?v=0.2.1"></script>
<script src="js/app.js?v=0.2.1"></script>
<!--APP-END-->
</body>
</html>
