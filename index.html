<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16121f">
<meta name="mobile-web-app-capable" content="yes">
<title>Traço Notas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=0.37.1">
</head>
<body>
<!--APP-START-->
<div id="app">
  <!-- ===== Biblioteca ===== -->
  <section id="library" class="screen lib">
    <aside class="lib-side" id="libSide">
      <div class="side-top">
        <div class="brand"><span class="logo"></span>Traço</div>
        <button class="icon-btn" id="btnSide" title="Recolher menu"><span data-icon="sidebar"></span></button>
      </div>
      <nav class="side-nav">
        <button class="side-item" data-view="home"><span data-icon="home"></span>Início</button>
        <button class="side-item" data-view="recent"><span data-icon="clock"></span>Recentes</button>
        <button class="side-item" data-view="marked"><span data-icon="bookmark"></span>Com marcadores</button>
        <button class="side-item" id="btnStudyReport"><span data-icon="timer"></span>Estudo</button>
        <button class="side-item" data-view="trash"><span data-icon="trash"></span>Lixeira<span class="side-badge" id="trashBadge"></span></button>
      </nav>
      <div class="side-sec">Pastas</div>
      <div id="sideFolders" class="side-folders"></div>
      <div id="sideRecent" class="side-recent"></div>
      <div class="side-bottom"><button class="side-item" id="btnSettings"><span data-icon="settings"></span>Configurações</button><div class="lib-ver"><span id="libVersion"></span><button class="upd-btn" id="btnUpdate" title="Verificar atualização"><span data-icon="refresh"></span><b>Verificar atualização</b></button></div></div>
    </aside>
    <main class="lib-main">
      <header class="lib-hero">
        <div class="hero-tools">
          <button class="icon-btn hero-side" id="btnSide2" title="Mostrar menu"><span data-icon="sidebar"></span></button>
          <span class="sp"></span>
          <span id="libTimer" class="timer-pill hidden"></span>
          <span id="libSync" class="sync-pill" title="Backup no Google Drive"></span>
          <div class="search"><span data-icon="search"></span><input id="libSearch" type="search" placeholder="Buscar notas e escrita"></div>
        </div>
        <h1 id="hello"></h1>
        <p class="hero-sub" id="heroQuote"></p>
        <div id="homeCards" class="home-cards hidden"></div>
      </header>
      <div class="lib-bar">
        <nav id="crumbs" class="crumbs"></nav>
        <div class="bar-tools">
          <button class="bar-btn" id="btnSort" title="Ordenar"></button>
          <button class="icon-btn" id="btnView" title="Alternar grade e lista"></button>
          <button class="icon-btn" id="btnSelect" title="Selecionar vários"><span data-icon="checkSq"></span></button>
        </div>
      </div>
      <div id="selActions" class="sel-actions hidden"></div>
      <div class="lib-body">
        <div id="itemGrid" class="item-grid"></div>
        <div id="libEmpty" class="empty hidden">
          <p>Nada por aqui ainda.</p>
          <button class="btn primary" id="btnNewNote2"><span data-icon="plus"></span>Criar uma nota</button>
        </div>
      </div>
      <button class="fab" id="btnFab" title="Criar"><span data-icon="plus"></span></button>
    </main>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" class="screen hidden">
    <div id="stage">
      <canvas id="cMain"></canvas>
      <canvas id="cLive"></canvas>
      <div id="overlay"></div>
      <div id="selBar" class="sel-bar hidden"></div>
    </div>
    <!-- Cromo flutuante (estilo Notewise) -->
    <div class="chrome ch-topleft">
      <button class="cbtn round" id="btnBack" title="Voltar"><span data-icon="arrowLeft"></span></button>
      <div class="cpill">
        <button class="cbtn" id="btnQuick" title="Alternar rapidamente (fixadas e recentes)"><span data-icon="layers"></span></button>
        <button class="cbtn gone" id="btnSplit" title="Tela dividida (outra nota ao lado)"><span data-icon="sidebar"></span></button>
        <button class="cbtn" id="btnPages" title="Páginas"><span data-icon="pages"></span></button>
        <button class="cbtn" id="btnAddPage" title="Adicionar página"><span data-icon="addPage"></span></button>
        <button class="cbtn" id="btnSearch" title="Buscar na nota"><span data-icon="search"></span></button>
        <button class="cbtn" id="btnExport" title="Exportar / compartilhar"><span data-icon="external"></span></button>
      </div>
    </div>
    <div class="chrome ch-title"><input id="noteTitle" class="title-input" spellcheck="false" title="Título da nota (toque para renomear)"><span id="noteClock" class="note-clock" title="Horário"></span><span id="noteBat" class="note-bat hidden" title="Bateria do tablet"></span><span id="noteTimer" class="note-timer hidden"></span></div>
    <div class="chrome ch-topright">
      <div class="cpill">
        <span id="edSync" class="sync-pill small"></span>
        <button class="cbtn gone" id="btnBookmark" title="Marcar esta página"><span data-icon="bookmark"></span></button>
        <button class="cbtn gone" id="btnOutline" title="Sumário (marcadores e índice do PDF)"><span data-icon="list"></span></button>
        <button class="cbtn" id="btnRead" title="Modo leitura"><span data-icon="eye"></span></button>
        <button class="cbtn" id="btnFull" title="Tela cheia (esconde as barras)"><span data-icon="full"></span></button>
        <button class="cbtn" id="hudPage" title="Páginas">1 / 1</button>
        <button class="cbtn gone" id="hudZoom" title="Zoom">100%</button>
        <button class="cbtn" id="btnEdSettings" title="Mais opções"><span data-icon="more"></span></button>
      </div>
    </div>
    <nav class="chrome rail" id="rail"></nav>
    <nav class="chrome subrail" id="subrail"></nav>
    <nav class="chrome hbar" id="hbar"></nav>
    <div class="vscroll" id="vscroll"><div class="vs-thumb"><span class="vs-bubble"></span></div></div>
    <div class="chrome tool-panel hidden" id="toolPanel"></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="popRoot"></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="filePick" class="hidden">
<script src="js/util.js?v=0.37.1"></script>
<script src="js/store.js?v=0.37.1"></script>
<script src="js/geom.js?v=0.37.1"></script>
<script src="js/render.js?v=0.37.1"></script>
<script src="js/pdf.js?v=0.37.1"></script>
<script src="js/tpl-import.js?v=0.37.1"></script>
<script src="js/drive.js?v=0.37.1"></script>
<script src="js/editor.js?v=0.37.1"></script>
<script src="js/toolbar.js?v=0.37.1"></script>
<script src="js/tables.js?v=0.37.1"></script>
<script src="js/tiles.js?v=0.37.1"></script>
<script src="js/navigation.js?v=0.37.1"></script>
<script src="js/richtext.js?v=0.37.1"></script>
<script src="js/crop.js?v=0.37.1"></script>
<script src="js/shapeedit.js?v=0.37.1"></script>
<script src="js/colorpicker.js?v=0.37.1"></script>
<script src="js/ui.js?v=0.37.1"></script>
<script src="js/ocr.js?v=0.37.1"></script>
<script src="js/beautify.js?v=0.37.1"></script>
<script src="js/calligraphy.js?v=0.37.1"></script>
<script src="js/import-notewise.js?v=0.37.1"></script>
<script src="js/library.js?v=0.37.1"></script>
<script src="js/plugins.js?v=0.37.1"></script>
<script src="js/workspace.js?v=0.37.1"></script>
<script src="js/autotoc.js?v=0.37.1"></script>
<script src="js/split.js?v=0.37.1"></script>
<script src="js/timer.js?v=0.37.1"></script>
<script src="js/pdfopen.js?v=0.37.1"></script>
<script src="js/notemenu.js?v=0.37.1"></script>
<script src="js/app.js?v=0.37.1"></script>
<!--APP-END-->
</body>
</html>
